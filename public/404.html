<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BIFOSS</title>
    <!-- GitHub Pages SPA trick: sends any unknown path to index.html with the path in the query string. -->
    <script>
      // Use 0 for a user/org site or custom domain at the root. Use 1 only for a project site at /repo-name/.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
